name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # A bootloader compiled from source has a unique signature instead of the
      # stock PyInstaller one, which is the main cause of antivirus false positives.
      - name: Install PyInstaller with a freshly compiled bootloader
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --no-binary pyinstaller pyinstaller==6.10.0

      - name: Build
        run: pyinstaller --noconfirm --clean Chione.spec

      # Optional: sign the exe if a code signing certificate is configured as
      # repository secrets (SIGN_PFX_BASE64 + SIGN_PFX_PASSWORD). Signing is the
      # most effective way to stop SmartScreen / antivirus warnings.
      - name: Sign executable
        if: env.HAS_CERT == 'true'
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like "*x64*" | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Chione\Chione.exe
          Remove-Item cert.pfx

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Chione\* -DestinationPath Chione-windows.zip
          $hash = (Get-FileHash Chione-windows.zip -Algorithm SHA256).Hash
          "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Chione v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: Chione-windows.zip
          body: |
            ## Chione v${{ inputs.version }}

            ### Fixes
            - **Allow Eating** and **Break Blocks** now work: the clicker no longer interrupts eating or block breaking.
            - Modules no longer stop silently (e.g. when a control is bound to an unsupported key).
            - SprintReset no longer leaves W stuck or keeps releasing it.
            - Hold Leftclick is more reliable (mouse hook no longer gets dropped by Windows).
            - Better support for AZERTY and Arabic keyboard layouts.
            - SelfDestruct, Reset Chione, dropdowns, tooltips and mouse hotkey labels fixed.
            - Errors are written to `chione_error.log` in your user folder.

            ### Install
            1. Download **Chione-windows.zip** and extract it to a folder.
            2. Run **Chione.exe** (keep it next to the `_internal` folder).

            This build is not packed with UPX and uses a custom-compiled bootloader to reduce antivirus false positives.

            SHA256: `${{ env.SHA256 }}`
