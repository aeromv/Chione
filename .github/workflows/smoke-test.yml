name: Smoke Test

# Launches the published release on a real Windows machine and reports whether
# it starts, stays running and logs any error. Also tests a fresh build.
on:
  workflow_dispatch:
  push:
    branches: [ccr-dc623798-nnwedb]

jobs:
  smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        source: [release, fresh-build]
    steps:
      - uses: actions/checkout@v4

      - name: Get published release
        if: matrix.source == 'release'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/aeromv/Chione/releases/latest/download/Chione-windows.zip -OutFile Chione-windows.zip
          Expand-Archive Chione-windows.zip -DestinationPath app

      - uses: actions/setup-python@v5
        if: matrix.source == 'fresh-build'
        with:
          python-version: "3.12"

      - name: Build from source
        if: matrix.source == 'fresh-build'
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.10.0
          pyinstaller --noconfirm --clean Chione.spec
          Copy-Item -Recurse dist\Chione app

      - name: Launch and observe
        shell: pwsh
        run: |
          Get-ChildItem app | Select-Object Name, Length | Format-Table
          Remove-Item "$env:USERPROFILE\chione_error.log" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path app\Chione.exe) -WorkingDirectory (Resolve-Path app) -PassThru
          Start-Sleep -Seconds 20

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png")

          "--- processes"
          Get-Process | Where-Object { $_.Name -like "Chione*" } | Select-Object Id, Name, MainWindowTitle, Responding | Format-Table
          $p.Refresh()
          "HasExited=$($p.HasExited)"
          if ($p.HasExited) { "ExitCode=$($p.ExitCode)" }
          "--- chione_error.log"
          if (Test-Path "$env:USERPROFILE\chione_error.log") { Get-Content "$env:USERPROFILE\chione_error.log" } else { "(no log file)" }
          "--- windows"
          Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object Name, MainWindowTitle | Format-Table

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.source }}
          path: screenshot.png
